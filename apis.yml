name: Smartsign
description: 'Smartsign (SmartSign) is a Brooklyn, New York-based e-commerce retailer
  of customizable signs, labels, and tags for regulatory, compliance, and safety applications,
  founded in 1999. It sells pre-designed and custom signage - safety, parking, traffic,
  property, and facility signs, plus banners and labels - online to businesses of all
  sizes, including a large share of the Fortune 1000 across education, healthcare, and
  industrial verticals. Norwest Venture Partners acquired the company in 2019 and Sentinel
  Capital Partners acquired it in September 2022. SmartSign operates as a business-to-business
  and business-to-consumer e-commerce storefront and does not publish a public developer
  API, developer portal, or OpenAPI surface.'
